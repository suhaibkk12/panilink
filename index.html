<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#123d4d">
<title>PaaniLink - Water Tanker Booking</title>
<style>
:root{
  --bg-1:#f3fbff;
  --bg-2:#edf9f6;
  --panel:#ffffff;
  --panel-2:#f7fcff;
  --ink:#183847;
  --muted:#4d6876;
  --primary:#1f8bb9;
  --primary-deep:#0d5d7e;
  --secondary:#0ca5a5;
  --accent:#f7b84b;
  --accent-2:#ff8a65;
  --success:#2f9e7b;
  --danger:#e8625a;
  --line:#dfeaf1;
  --shadow:rgba(19,52,63,.12);
  --glow:rgba(31,139,185,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font:16px/1.5 "Segoe UI",system-ui,sans-serif;
  background:linear-gradient(180deg,var(--bg-1) 0%, var(--bg-2) 100%);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  -webkit-tap-highlight-color:transparent;
}
header{
  display:flex;
  flex-wrap:wrap;
  gap:.75rem 1.2rem;
  align-items:center;
  justify-content:space-between;
  padding:1rem 1.4rem;
  background:linear-gradient(135deg,#0f2d3c 0%, #123d4d 35%, #1d6f8c 100%);
  color:#fff;
  box-shadow:0 16px 30px rgba(12,42,51,.18);
  position:relative;
  overflow:hidden;
}
header::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at top right, rgba(247,184,75,.28), transparent 30%);
  pointer-events:none;
}
header > *{position:relative;z-index:1}
header h1{margin:0;font:700 1.6rem Georgia,serif;letter-spacing:.03em}
nav{display:flex;gap:.45rem;flex:1;flex-wrap:wrap}
nav button,#who button{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  color:#fff;
  padding:.52rem .9rem;
  border-radius:999px;
  cursor:pointer;
  font:inherit;
  transition:all .2s ease;
}
nav button:hover,#who button:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
nav button.on{
  background:rgba(247,184,75,.18);
  border-color:rgba(247,184,75,.6);
  box-shadow:inset 0 0 0 1px rgba(247,184,75,.28);
}
main{max-width:1160px;margin:1.2rem auto;padding:0 1rem;display:grid;gap:1rem}
.card{
  background:linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
  border:1px solid var(--line);
  border-radius:18px;
  padding:1rem;
  box-shadow:0 10px 25px var(--shadow);
}
h2{margin:.2rem 0 .8rem;font-size:1.35rem;color:var(--primary-deep)}
.row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:flex-end}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}
.login-card{width:min(100%,560px);margin:0 auto}
.login-switch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.35rem;padding:.3rem;margin-bottom:1rem;border:1px solid var(--line);border-radius:12px;background:#edf4f6}
.login-switch button{min-width:0;border:0;border-radius:9px;padding:.65rem .8rem;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}
.login-switch button[aria-pressed="true"]{background:#fff;color:var(--primary-deep);box-shadow:0 2px 8px rgba(19,52,63,.12)}
.login-card form{grid-template-columns:1fr}
label{display:flex;flex-direction:column;font-size:.84rem;gap:.25rem;font-weight:700;color:var(--ink)}
input,select,textarea,button{font:inherit}
input,select,textarea{
  padding:.75rem .8rem;
  border:1px solid #bfd3dd;
  border-radius:12px;
  background:#fff;
  min-width:0;
  color:var(--ink);
  box-shadow:inset 0 1px 2px rgba(19,52,63,.03);
  font-size:16px;
}
button, .btn { min-height:44px; }
:focus-visible{outline:3px solid rgba(247,184,75,.45);outline-offset:2px}
.btn{
  background:linear-gradient(135deg,var(--primary) 0%, var(--primary-deep) 100%);
  color:#fff;border:0;padding:.7rem 1rem;border-radius:12px;cursor:pointer;min-height:42px;font-weight:700;
  box-shadow:0 10px 20px rgba(17,101,136,.2);
  transition:transform .18s ease, box-shadow .18s ease;
}
.btn:hover{transform:translateY(-1px)}
.btn.alt{background:#fff;color:var(--ink);border:1px solid rgba(31,139,185,.35)}
.btn.bad{background:linear-gradient(135deg,var(--danger) 0%, #d45a4d 100%)}
.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none;transform:none}
.err{color:var(--danger);font-size:.85rem;min-height:1.1em;font-weight:600}
.pill{padding:.18rem .7rem;border-radius:999px;background:#edf7ff;font-size:.78rem;font-weight:700;display:inline-block}
.pill.Pending{background:#fff3d6;color:#946100}
.pill.Failed,.pill.Rejected,.pill.Disputed,.pill.Cancelled{background:#fde7e4;color:#b75046}
.pill.Delivered,.pill.Confirmed,.pill.Resolved{background:#e0f6ef;color:#1b7d5e}
.pill.Approved,.pill.Assigned,.pill.Filled,.pill.Arrived,.pill.Available{background:#e4f6ff;color:#0d6a85}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:.7rem .65rem;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f5fbfd;color:var(--primary-deep);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
.acts{display:flex;gap:.42rem;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem}
.stat b{display:block;font-size:1.5rem;color:var(--primary-deep)}
.bar{display:block;height:10px;background:#e7eff4;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:999px}
#toast{position:fixed;bottom:1rem;left:50%;transform:translate(-50%,200%);background:#123b4d;color:#fff;padding:.75rem 1.2rem;border-radius:12px;transition:transform .2s;max-width:90vw;box-shadow:0 18px 34px rgba(18,59,77,.24)}
#toast.show{transform:translate(-50%,0)}#toast.bad{background:linear-gradient(135deg,var(--danger),#ca4f42)}
@media(max-width:700px){
  header{padding: .85rem 1rem;}
  nav{width:100%;justify-content:center}
  #who{width:100%;display:flex;justify-content:center;align-items:center;gap:.5rem;flex-wrap:wrap}
  table,thead,tbody,tr,td{display:block}thead{display:none}
  tr{border:1px solid var(--line);border-radius:12px;margin-bottom:.8rem;padding:.55rem;background:#fff}
  td{border:0;display:flex;justify-content:space-between;gap:.75rem;padding:.38rem .45rem}
  td::before{content:attr(data-label);font-weight:700;color:var(--primary)}
  .acts button{flex:1;min-height:52px;font-size:1.05rem}
  .row>label,.row>button{flex:1 1 100%}
  .card{padding:.9rem}
  main{padding:0 .75rem}
}
@media(max-width:480px){
  body{font-size:15px}
  header h1{font-size:1.3rem}
  nav button,#who button{padding:.5rem .75rem;font-size:.9rem}
  .login-switch{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid{grid-template-columns:1fr}
  .card{border-radius:14px}
  .btn{width:100%}
}
@supports(padding:max(0px)){
  body{padding-bottom:max(1rem, env(safe-area-inset-bottom));}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}#toast{transition:none}}
</style>
</head>
<body>
<header><h1>PaaniLink</h1><nav id="nav" aria-label="Main"></nav><div id="who"></div></header>
<main id="main"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* =====================================================================
   MOCK API  (replaces the real server for the frontend phase).
   All app code below talks to it ONLY through fetch('/api/...').
   Data is saved in localStorage. Failed requests roll back (snapshot).
   ===================================================================== */
const DEAD = ['Rejected', 'Cancelled', 'Failed'], LIVE = ['Assigned', 'Refilled', 'Filled', 'Arrived'];
const E = (s, m) => { throw { s, m }; };
const todayStr = () => new Date().toISOString().slice(0, 10);
const buildDefaultDB = () => {
  const u = (id, name, email, role, o = {}) => ({ id, name, email, password: 'pass123', role, cnic: '', phone: '', address: '', zone_id: null, hydrant_id: null, subsidy_status: 'none', subsidy_proof: '', monthly_limit: 0, ...o });
  return {
    seq: 100,
    zones: [
      { id: 1, name: 'Gulshan' },
      { id: 2, name: 'Korangi' },
      { id: 3, name: 'Clifton' },
      { id: 4, name: 'Defence Housing Authority (DHA)' },
      { id: 5, name: 'North Nazimabad' },
      { id: 6, name: 'Nazimabad' },
      { id: 7, name: 'Liaquatabad' },
      { id: 8, name: 'Saddar' },
      { id: 9, name: 'Lyari' },
      { id: 10, name: 'Keamari' },
      { id: 11, name: 'Malir' },
      { id: 12, name: 'Landhi' },
      { id: 13, name: 'Shah Faisal' },
      { id: 14, name: 'Gulistan-e-Jauhar' },
      { id: 15, name: 'Orangi Town' },
      { id: 16, name: 'Baldia Town' },
      { id: 17, name: 'Federal B Area' },
      { id: 18, name: 'SITE' },
      { id: 19, name: 'Model Colony' },
      { id: 20, name: 'Surjani Town' },
      { id: 21, name: 'Gadap Town' },
      { id: 22, name: 'Mominabad' }
    ],
    hydrants: [{ id: 1, name: 'Hydrant Gulshan', daily_quota: 9000, open_hour: 6, close_hour: 20, available: 1, zones: [1] },
               { id: 2, name: 'Hydrant Korangi', daily_quota: 12000, open_hour: 6, close_hour: 20, available: 1, zones: [2] }],
    rates: [{ size: 1000, commercial: 1500, subsidised: 300 }, { size: 3000, commercial: 4000, subsidised: 800 }, { size: 6000, commercial: 7500, subsidised: 1500 }],
    tankers: [{ id: 1, hydrant_id: 1, plate: 'KHI-101', size: 1000, available: 1 }, { id: 2, hydrant_id: 1, plate: 'KHI-103', size: 3000, available: 1 },
              { id: 3, hydrant_id: 1, plate: 'KHI-106', size: 6000, available: 1 }, { id: 4, hydrant_id: 2, plate: 'KHI-203', size: 3000, available: 1 }],
    users: [u(1, 'Admin', 'abd.67251@iqra.edu.pk', 'admin', { password: '12345' }), u(2, 'Officer Gulshan', 'officer@pl.pk', 'officer', { zone_id: 1 }),
            u(3, 'Operator Gulshan', 'operator@pl.pk', 'operator', { hydrant_id: 1 }), u(4, 'Driver Ali', 'driver1@pl.pk', 'driver', { hydrant_id: 1 }),
          u(5, 'Driver Bilal', 'driver2@pl.pk', 'driver', { hydrant_id: 1 })],
    bookings: []
  };
};

let DB = JSON.parse(localStorage.getItem('pl_db') || 'null');
if (!DB || !DB.users || !DB.users.some(u => u.email === 'abd.67251@iqra.edu.pk')) {
  DB = buildDefaultDB();
  localStorage.setItem('pl_db', JSON.stringify(DB));
  localStorage.removeItem('pl_token');
}
const removedCustomerIds = new Set(DB.users.filter(user => user.name === 'Sara Khan' && user.email === 'customer@pl.pk').map(user => user.id));
if (removedCustomerIds.size) {
  DB.users = DB.users.filter(user => !removedCustomerIds.has(user.id));
  DB.bookings = DB.bookings.filter(booking => !removedCustomerIds.has(booking.customer_id));
  const signedInId = Number(String(localStorage.getItem('pl_token') || '').replace(/^tok-/, ''));
  if (removedCustomerIds.has(signedInId)) localStorage.removeItem('pl_token');
}
DB.seq = Math.max(Number(DB.seq) || 0, ...DB.users.map(u => Number(u.id) || 0));
const seedRoleAccount = (email, name, role) => {
  let user = DB.users.find(u => u.email === email);
  if (!user) {
    user = { id: ++DB.seq, name, email, password: '123', role, cnic: '', phone: '', address: '', zone_id: null, hydrant_id: 1, subsidy_status: 'none', subsidy_proof: '', monthly_limit: 0 };
    DB.users.push(user);
  } else Object.assign(user, { name, password: '123', role, hydrant_id: 1 });
};
seedRoleAccount('pani@driver.pk', 'PaaniLink Driver', 'driver');
seedRoleAccount('pani@operator.pk', 'PaaniLink Operator', 'operator');
DB.zones.forEach(zone => {
  if (!(Number(zone.daily_quota) >= 1000)) zone.daily_quota = 10000;
});
const serviceableZoneIds = DB.zones.map(zone => zone.id);
const totalZoneQuota = DB.zones.reduce((total, zone) => total + Number(zone.daily_quota), 0);
DB.hydrants.forEach(hydrant => {
  hydrant.zones = [...new Set([...(hydrant.zones || []), ...serviceableZoneIds])];
  hydrant.daily_quota = Math.max(Number(hydrant.daily_quota) || 0, totalZoneQuota);
});
localStorage.setItem('pl_db', JSON.stringify(DB));
const pub = ({ password, ...u }) => u;
const owns = (u, b) => ({ customer: b.customer_id === u.id, officer: b.zone_id === u.zone_id, operator: b.hydrant_id === u.hydrant_id, driver: b.driver_id === u.id, admin: true })[u.role];
const used = (hid, date) => DB.bookings.filter(b => b.hydrant_id === hid && b.date === date && !DEAD.includes(b.status)).reduce((s, b) => s + b.size, 0);
const usedInZone = (zoneId, date) => DB.bookings.filter(b => b.zone_id === zoneId && b.date === date && !DEAD.includes(b.status)).reduce((s, b) => s + b.size, 0);
const T = { cancel: [['customer'], ['Pending', 'Approved', 'Assigned'], 'Cancelled'], approve: [['officer'], ['Pending'], 'Approved'], reject: [['officer'], ['Pending'], 'Rejected'],
  autoAssign: [['operator'], ['Pending'], 'Assigned'],
  assign: [['operator'], ['Approved'], 'Assigned'], fill: [['operator'], ['Assigned'], 'Refilled'], confirmFill: [['driver'], ['Refilled'], 'Filled'], arrive: [['driver'], ['Filled'], 'Arrived'],
  deliver: [['driver'], ['Arrived'], 'Delivered'], fail: [['driver'], ['Filled', 'Arrived'], 'Failed'],
  confirm: [['customer'], ['Delivered'], 'Confirmed'], dispute: [['customer'], ['Delivered'], 'Disputed'], resolve: [['officer'], ['Disputed'], 'Resolved'] };

// [method, path regex, allowed roles (null public, [] any), handler]
const ROUTES = [
  ['GET', /^\/meta$/, null, () => ({ zones: DB.zones, rates: DB.rates })],
  ['POST', /^\/auth\/register$/, null, ({ body: b }) => {
    const er = [];
    if (!b.name || b.name.trim().length < 3) er.push('Name must be at least 3 characters');
    if (!/^\S+@\S+\.\S+$/.test(b.email || '')) er.push('Valid email required');
    if (!b.password || b.password.length < 6) er.push('Password must be at least 6 characters');
    if (!/^\d{5}-\d{7}-\d$/.test(b.cnic || '')) er.push('CNIC format: 12345-1234567-1');
    if (!/^03\d{2}-?\d{7}$/.test(b.phone || '')) er.push('Phone format: 0300-1234567');
    if (!b.address || b.address.trim().length < 5) er.push('Address is required');
    if (!DB.zones.some(z => z.id == b.zone_id)) er.push('Choose a valid zone');
    if (er.length) E(400, er.join('. '));
    if (DB.users.some(x => x.email === b.email.toLowerCase())) E(409, 'Email already registered');
    DB.users.push({ id: ++DB.seq, name: b.name.trim(), email: b.email.toLowerCase(), password: b.password, role: 'customer', cnic: b.cnic, phone: b.phone, address: b.address.trim(), zone_id: +b.zone_id, hydrant_id: null, subsidy_status: 'none', subsidy_proof: '', monthly_limit: 0 });
    return { ok: true };
  }],
  ['POST', /^\/auth\/login$/, null, ({ body: b }) => {
    const u = DB.users.find(x => x.email === String(b.email || '').toLowerCase() && x.password === b.password);
    if (!u) E(401, 'Wrong email or password');
    return { token: 'tok-' + u.id, user: pub(u) };
  }],
  ['GET', /^\/me$/, [], ({ u }) => pub(u)],

  ['POST', /^\/subsidy$/, ['customer'], ({ u, body }) => {
    if ((body.proof || '').trim().length < 10) E(400, 'Describe your proof (at least 10 characters)');
    if (['approved', 'pending'].includes(u.subsidy_status)) E(409, 'Application already ' + u.subsidy_status);
    u.subsidy_status = 'pending'; u.subsidy_proof = body.proof.trim(); return { ok: true };
  }],
  ['GET', /^\/subsidy$/, ['officer'], ({ u }) => DB.users.filter(x => x.role === 'customer' && x.zone_id === u.zone_id && x.subsidy_status === 'pending').map(pub)],
  ['PATCH', /^\/subsidy\/(\d+)$/, ['officer'], ({ u, m, body }) => {
    const c = DB.users.find(x => x.id == m[1] && x.zone_id === u.zone_id && x.subsidy_status === 'pending');
    if (!c) E(404, 'No pending application for this zone');
    if (!['approved', 'rejected'].includes(body.decision)) E(400, 'Decision must be approved or rejected');
    if (body.decision === 'approved' && !(+body.monthly_limit >= 1 && +body.monthly_limit <= 20)) E(400, 'Monthly limit must be 1 to 20');
    c.subsidy_status = body.decision; c.monthly_limit = body.decision === 'approved' ? +body.monthly_limit : 0; return { ok: true };
  }],

  ['POST', /^\/bookings$/, ['customer'], ({ u, body: b }) => {
    const rate = DB.rates.find(r => r.size === +b.size);
    if (!rate) E(400, 'Invalid tanker size');
    if (!['commercial', 'subsidised'].includes(b.type)) E(400, 'Invalid booking type');
    const max = new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(b.date || '') || b.date < todayStr() || b.date > max) E(400, 'Date must be within the next 30 days');
    const zone = DB.zones.find(z => z.id === u.zone_id);
    if (!zone || zone.daily_quota - usedInZone(zone.id, b.date) < rate.size) E(409, `Daily hydrant quota for ${zone?.name || 'your zone'} is full`);
    if (!Number.isInteger(+b.slot) || b.slot < 0 || b.slot > 23) E(400, 'Invalid time slot');
    if (b.type === 'subsidised') {
      if (u.subsidy_status !== 'approved') E(403, 'Subsidy not approved for your account');
      const n = DB.bookings.filter(x => x.customer_id === u.id && x.type === 'subsidised' && x.date.slice(0, 7) === b.date.slice(0, 7) && !DEAD.includes(x.status)).length;
      if (n >= u.monthly_limit) E(409, `Monthly subsidised limit (${u.monthly_limit}) reached`);
    }
    const h = DB.hydrants.find(h => h.zones.includes(u.zone_id) && h.available && b.slot >= h.open_hour && b.slot < h.close_hour && h.daily_quota - used(h.id, b.date) >= rate.size);
    if (!h) E(409, 'No hydrant in your zone is open with enough water for that date and time');
    const bk = { id: ++DB.seq, customer_id: u.id, zone_id: u.zone_id, hydrant_id: h.id, tanker_id: null, driver_id: null, size: rate.size, type: b.type,
      status: 'Pending', date: b.date, slot: +b.slot, price: rate[b.type], fail_reason: '', history: [] };
    bk.history.push({ action: 'created', by: u.name, at: new Date().toISOString() }); DB.bookings.push(bk); return { id: bk.id };
  }],
  ['GET', /^\/bookings$/, [], ({ u, q }) => {
    const page = Math.max(1, +q.page || 1), limit = Math.min(50, Math.max(1, +q.limit || 10)), s = (q.q || '').toLowerCase();
    let rows = DB.bookings.filter(b => owns(u, b) && (!q.status || b.status === q.status) && (!q.type || b.type === q.type) && (!q.date || b.date === q.date))
      .map(b => { const c = DB.users.find(x => x.id === b.customer_id), t = DB.tankers.find(x => x.id === b.tanker_id), d = DB.users.find(x => x.id === b.driver_id);
        return { ...b, customer: c.name, address: c.address, phone: c.phone, plate: t?.plate, driver: d?.name }; })
      .filter(b => !s || [b.customer, b.address, b.plate].some(v => (v || '').toLowerCase().includes(s)));
    const k = ['date', 'status', 'price', 'id'].includes(q.sort) ? q.sort : 'date', dir = q.order === 'asc' ? 1 : -1;
    rows.sort((a, b) => (a[k] > b[k] ? 1 : a[k] < b[k] ? -1 : 0) * dir || b.id - a.id);
    return { rows: rows.slice((page - 1) * limit, page * limit), total: rows.length, page, pages: Math.ceil(rows.length / limit) || 1 };
  }],
  ['POST', /^\/bookings\/(\d+)\/(\w+)$/, [], ({ u, m, body }) => {
    const t = T[m[2]]; if (!t) E(404, 'Unknown action');
    if (!t[0].includes(u.role)) E(403, `Your role cannot ${m[2]} a booking`);
    const b = DB.bookings.find(x => x.id == m[1]); if (!b || !owns(u, b)) E(404, 'Booking not found');
    if (!t[1].includes(b.status)) E(409, `Cannot ${m[2]} a booking that is ${b.status}`);
    if (['fail', 'dispute', 'resolve'].includes(m[2]) && !(body.note || '').trim()) E(400, 'A reason is required');
    if (m[2] === 'autoAssign') {
      const hasClash = (field, id) => DB.bookings.some(x => x.id !== b.id && x.date === b.date && x.slot === b.slot && LIVE.includes(x.status) && x[field] === id);
      const tn = DB.tankers.find(x => x.hydrant_id === b.hydrant_id && x.size === b.size && x.available && !hasClash('tanker_id', x.id));
      const availableDrivers = DB.users.filter(x => x.role === 'driver' && x.hydrant_id === b.hydrant_id && !hasClash('driver_id', x.id));
      const dv = availableDrivers.find(x => x.email === 'pani@driver.pk') || availableDrivers[0];
      if (!tn || !dv) E(409, 'No available matching tanker and driver for this date and time');
      b.tanker_id = tn.id; b.driver_id = dv.id;
    }
    if (m[2] === 'assign') {
      const tn = DB.tankers.find(x => x.id === body.tanker_id), dv = DB.users.find(x => x.id === body.driver_id && x.role === 'driver');
      if (!tn || tn.hydrant_id !== b.hydrant_id) E(400, 'Tanker does not belong to this hydrant');
      if (!tn.available) E(409, 'Tanker is marked unavailable');
      if (tn.size !== b.size) E(400, 'Tanker size must match the booking size');
      if (!dv || dv.hydrant_id !== b.hydrant_id) E(400, 'Driver does not belong to this hydrant');

      b.tanker_id = tn.id; b.driver_id = dv.id;
    }
    if (m[2] === 'fail') b.fail_reason = body.note;
    b.status = t[2]; b.history.push({ action: m[2], by: u.name, note: body.note || '', at: new Date().toISOString() }); return b;
  }],

  ['GET', /^\/hydrants$/, [], ({ u }) => DB.hydrants.filter(h => u.role !== 'operator' || h.id === u.hydrant_id)
    .map(h => ({ ...h, zones: h.zones.map(z => DB.zones.find(x => x.id === z).name).join(', '), used_today: used(h.id, todayStr()) }))],
  ['GET', /^\/tankers$/, ['operator', 'admin'], ({ u }) => DB.tankers.filter(t => u.role !== 'operator' || t.hydrant_id === u.hydrant_id)],
  ['GET', /^\/drivers$/, ['operator', 'admin'], ({ u }) => DB.users.filter(d => d.role === 'driver' && (u.role !== 'operator' || d.hydrant_id === u.hydrant_id)).map(pub)],
  ['PATCH', /^\/tankers\/(\d+)$/, ['operator', 'admin'], ({ u, m, body }) => {
    const t = DB.tankers.find(x => x.id == m[1]); if (!t || (u.role === 'operator' && t.hydrant_id !== u.hydrant_id)) E(404, 'Tanker not found');
    t.available = body.available ? 1 : 0; return { ok: true };

  ['PATCH', /^\/hydrants\/(\d+)$/, ['operator', 'admin'], ({ u, m, body }) => {
    const h = DB.hydrants.find(x => x.id == m[1]); if (!h || (u.role === 'operator' && u.hydrant_id !== h.id)) E(404, 'Hydrant not found');
    if (body.available !== undefined) h.available = body.available ? 1 : 0;
    if (u.role === 'admin' && body.daily_quota !== undefined) { if (!(+body.daily_quota >= 1000)) E(400, 'Quota must be at least 1000 gallons'); h.daily_quota = +body.daily_quota; }

  ['PUT', /^\/zones\/(\d+)\/quota$/, ['admin'], ({ m, body }) => {

    if (!(+body.daily_quota >= 1000)) E(400, 'Quota must be at least 1000 gallons');
    zone.daily_quota = +body.daily_quota;

    DB.bookings.forEach(b => st[b.status] = (st[b.status] || 0) + 1);

// Intercept fetch('/api/...'): auth, role check, run handler, roll back DB on any error
const realFetch = window.fetch.bind(window);
window.fetch = async (url, o = {}) => {
  if (!String(url).startsWith('/api/')) return realFetch(url, o);
  await new Promise(r => setTimeout(r, 120));
  const U = new URL(url, location.origin), path = U.pathname.slice(4), method = (o.method || 'GET').toUpperCase(), snap = JSON.stringify(DB);
  const reply = (s, d) => new Response(JSON.stringify(d), { status: s, headers: { 'Content-Type': 'application/json' } });
  try {
    for (const [mt, re, roles, fn] of ROUTES) {
      const m = path.match(re); if (mt !== method || !m) continue;
      let u = null;
      if (roles) {
        const id = +String(o.headers?.Authorization || '').replace('Bearer tok-', '');
        u = DB.users.find(x => x.id === id); if (!u) return reply(401, { error: 'Please log in' });
        if (roles.length && !roles.includes(u.role)) return reply(403, { error: 'Your role is not allowed to do this' });
      }
      const out = fn({ u, m, q: Object.fromEntries(U.searchParams), body: o.body ? JSON.parse(o.body) : {} });
      localStorage.setItem('pl_db', JSON.stringify(DB)); return reply(200, out);
    }
    return reply(404, { error: 'Not found' });
  } catch (e) {
    DB = JSON.parse(snap);  // rollback
    return e.s ? reply(e.s, { error: e.m }) : reply(500, { error: 'Server error' });
  }
};

const STATUS = ['Pending', 'Approved', 'Assigned', 'Refilled', 'Filled', 'Arrived', 'Delivered', 'Failed', 'Confirmed', 'Disputed', 'Resolved', 'Rejected', 'Cancelled'];

async function api(path, method = 'GET', body) {
  const r = await fetch('/api' + path, { method, headers: { 'Content-Type': 'application/json', ...(token && { Authorization: 'Bearer ' + token }) }, body: body && JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { if (r.status === 401 && token) logout(); throw new Error(d.error || 'Request failed'); }
  return d;
}

      return `<div><b>${esc(q.name)}</b><p>${available.toLocaleString()} / ${q.daily_quota.toLocaleString()} gal available<br><small>${q.booked.toLocaleString()} gal booked</small></p><span class="bar" role="img" aria-label="${available} gallons available of ${q.daily_quota}"><i style="width:${fill}%"></i></span></div>`;
    }).join('')}</div></section>
    <section class="card"><h2>Bookings by zone</h2><table><thead><tr><th>Zone</th><th>Bookings</th><th>Value</th></tr></thead><tbody>${d.byZone.map(z => `<tr><td data-label="Zone">${esc(z.name)}</td><td data-label="Bookings">${z.n}</td><td data-label="Value">${money(z.revenue)}</td></tr>`).join('')}</tbody></table></section>`;
}
async function configView() {
  const [d, m] = await Promise.all([api('/admin/dashboard'), api('/meta')]); meta = m;
  $('#main').innerHTML = `<section class="card"><h2>Rates</h2>${m.rates.map(r => `<form class="row rate" data-size="${r.size}">
    <b>${r.size} gal</b><label>Commercial<input type="number" name="commercial" min="1" value="${r.commercial}" required></label>
    <label>Subsidised<input type="number" name="subsidised" min="1" value="${r.subsidised}" required></label><button class="btn">Save</button></form>`).join('')}</section>
    <section class="card"><h2>Daily hydrant quotas by area</h2>${d.quota.map(zone => `<form class="row quota" data-id="${zone.id}"><b>${esc(zone.name)}</b>
    <span>Booked today: ${zone.booked.toLocaleString()} gal</span><label>Daily quota (gal)<input type="number" name="q" min="1000" value="${zone.daily_quota}" required></label><button class="btn">Save</button></form>`).join('')}</section>`;
  $('#main').onsubmit = guard(async e => {
    e.preventDefault(); const f = e.target;
    if (f.classList.contains('rate')) await api('/rates/' + f.dataset.size, 'PUT', { commercial: +f.commercial.value, subsidised: +f.subsidised.value });
    else await api('/zones/' + f.dataset.id + '/quota', 'PUT', { daily_quota: +f.q.value });
    toast('Saved');
  });
}
guard(start)();
</script>
</body>
</html>
